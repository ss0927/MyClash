name: Build EmbyDirect SRS

on:
  push:
    branches:
      - main
    paths:
      - "Rules/EmbyDirect.yaml"
      - "scripts/build_emby_ruleset.py"
      - ".github/workflows/build-emby-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-emby-direct
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate sing-box source JSON
        run: python3 scripts/build_emby_ruleset.py

      - name: Install sing-box
        run: |
          go install github.com/sagernet/sing-box/cmd/sing-box@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Compile binary rule set
        run: |
          sing-box version
          sing-box rule-set compile --output Rules/EmbyDirect.srs Rules/EmbyDirect.json
          test -s Rules/EmbyDirect.srs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rules/EmbyDirect.json Rules/EmbyDirect.srs
          if ! git diff --cached --quiet; then
            git commit -m "Build EmbyDirect sing-box rule set"
            git push
          else
            echo "Generated rule set is already up to date."
          fi
